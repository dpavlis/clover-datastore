name: Open question
description: Something the spec does not answer yet
title: "Q: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: One question, phrased so that it can be decided.
    validations:
      required: true
  - type: input
    id: sections
    attributes:
      label: Sections concerned
      placeholder: "e.g. §7.6, §8.4"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why it matters
      description: The case or risk that raises the question. Include code references or measurements if you have them.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: The options you see, with their trade-offs. Mark the one you would recommend, if any.
  - type: markdown
    attributes:
      value: When the question is accepted, it gets the next free Q number in spec/13-questions.md.
